# The same as the overlay variant, but in a new kitty OS window.
# kitty makes the value of fragment_matches lower case when it reads this file, so the pattern uses (?i).
protocol file
fragment_matches (?i)^l?[0-9]+$
action launch --type=os-window --title=guilda-link sh -c 'n="$1"; exec less -N +"${n#L}"g -- "$2"' guilda-open $FRAGMENT $FILE_PATH
