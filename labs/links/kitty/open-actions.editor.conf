# The same as the overlay variant, but in the terminal editor of kitty ($EDITOR, from the option editor,
# VISUAL or EDITOR). nano, vim, nvim and micro accept +<line> before the file.
# kitty makes the value of fragment_matches lower case when it reads this file, so the pattern uses (?i).
protocol file
fragment_matches (?i)^l?[0-9]+$
action launch --type=overlay --title=guilda-link sh -c 'n="$1"; f="$2"; shift 2; exec "$@" +"${n#L}" "$f"' guilda-open $FRAGMENT $FILE_PATH $EDITOR
