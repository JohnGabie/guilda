# A click on a file:// link with a line in the fragment (#633 or #L633) opens the file at that line
# in less, in an overlay over the current kitty window. q closes it.
# kitty makes the value of fragment_matches lower case when it reads this file, so the pattern uses (?i).
protocol file
fragment_matches (?i)^l?[0-9]+$
action launch --type=overlay --title=guilda-link sh -c 'n="$1"; exec less -N +"${n#L}"g -- "$2"' guilda-open $FRAGMENT $FILE_PATH

# A file:// link to a repo folder with #commit=<hash> (made by linkify.mjs) shows that commit in an overlay.
protocol file
fragment_matches ^commit=[0-9a-f]{7,40}$
action launch --type=overlay --title=guilda-link sh -c 'exec git -C "$2" show "${1#commit=}"' guilda-open $FRAGMENT $FILE_PATH
