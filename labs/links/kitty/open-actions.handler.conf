# The click runs the guilda handler sketch in an overlay. It picks the opener from links.open in
# .guilda/config.json, or from the environment. try-kitty.sh replaces @HANDLER@ with the path of open-at-line.mjs.
# kitty makes the value of fragment_matches lower case when it reads this file, so the pattern uses (?i).
protocol file
fragment_matches (?i)^l?[0-9]+$
action launch --type=overlay --title=guilda-link node @HANDLER@ $FILE_PATH $FRAGMENT
