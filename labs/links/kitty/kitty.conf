# Test kitty config for the links lab. try-kitty.sh copies it to a temporary config directory
# (KITTY_CONFIG_DIRECTORY), next to one open-actions file. It does not change the normal config.
# The normal config of the user, if it exists. kitty ignores an include of a file that is not there.
include ~/.config/kitty/kitty.conf
# A custom tab bar loads tab_bar.py from the config directory. The temporary directory has no tab_bar.py.
tab_bar_style powerline
# The kitty defaults, written here so that the test does not depend on the normal config.
allow_hyperlinks yes
open_url_with default
